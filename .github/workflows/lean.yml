name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      USE_FRO_CACHE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify source provenance and inventory
        run: python3 scripts/claims.py
      - name: Compile pinned Lean project
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
      - name: Audit every theorem's transitive axioms
        run: python3 scripts/audit.py

  jordan:
    name: Universal Jordan-contour companion
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: jordan/.lake
          key: jordan-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jordan/lean-toolchain') }}-${{ hashFiles('jordan/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: jordan-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('jordan/lean-toolchain') }}-${{ hashFiles('jordan/lake-manifest.json') }}-
      - name: Install the independent pinned toolchain
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          lake-package-directory: jordan
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"
      - name: Fetch the pinned mathematical dependencies
        working-directory: jordan
        run: |
          lake update
          python3 scripts/fetch_cache.py
      - name: Compile the full Jordan proof
        working-directory: jordan
        run: lake build
      - name: Audit local and imported Schoenflies proofs
        working-directory: jordan
        run: python3 scripts/audit.py
